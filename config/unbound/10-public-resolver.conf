# Oeffentlicher, verschluesselter DNS-Resolver
# Oeffentlich: nur DoT (853/TCP, siehe 20-dot.conf) und DoH (nginx 443 -> 127.0.0.1:8053)
# Port 53 (unverschluesselt) ist absichtlich NUR lokal erreichbar.

server:
    # ---------- Wo Unbound zuhoert ----------
    # Port 53 nur fuer den Server selbst (kein offener Resolver -> keine DDoS-Verstaerkung)
    interface: 127.0.0.1@53
    interface: ::1@53
    # DoH-Backend: nur nginx spricht hier per HTTP/2 ohne TLS; TLS macht nginx auf 443
    interface: 127.0.0.1@8053
    https-port: 8053
    http-notls-downstream: yes
    http-endpoint: "/dns-query"

    # ---------- Privatsphaere: nichts mitschreiben ----------
    verbosity: 1
    log-queries: no
    log-replies: no
    log-local-actions: no
    log-servfail: no
    val-log-level: 0
    hide-identity: yes
    hide-version: yes
    hide-trustanchor: yes
    # Fremde Nameserver sehen nur den Teil des Namens, den sie wirklich brauchen
    qname-minimisation: yes
    minimal-responses: yes
    # Verschluesselte Antworten auf Blockgroesse auffuellen (Laenge verraet sonst die Domain)
    pad-responses: yes
    # Kein "subnetcache"-Modul -> keine Client-IP-Teile (ECS) an fremde Nameserver
    module-config: "validator iterator"

    # ---------- Sicherheit: DNSSEC und Haertung ----------
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-short-bufsize: yes
    aggressive-nsec: yes
    # Viele unerwartete Antworten = Spoofing-Versuch -> Cache vorsorglich leeren
    unwanted-reply-threshold: 10000000
    # Keine fragmentierten UDP-Antworten (Angriffsflaeche fuer gefaelschte Antworten)
    edns-buffer-size: 1232
    # Extended DNS Errors: Clients sehen, WARUM etwas fehlschlug (z.B. DNSSEC bogus)
    ede: yes

    # DNS-Rebinding-Schutz: oeffentliche Namen duerfen nicht auf private Netze zeigen
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 100.64.0.0/10
    private-address: fd00::/8
    private-address: fe80::/10
    private-address: ::ffff:0:0/96

    # ---------- Missbrauchsschutz ----------
    # ANY-Anfragen sind der klassische Verstaerker -> nicht beantworten
    deny-any: yes
    # Max. Anfragen/s pro Zone an fremde Nameserver (schuetzt Dritte vor Missbrauch ueber uns)
    ratelimit: 1000
    # Genug TCP-Plaetze fuer DoT/DoH-Verbindungen, aber begrenzt
    incoming-num-tcp: 200
    # Clients duerfen Verbindungen 2 min offen halten -> weniger TLS-Handshakes.
    # Gilt fuer alle eingehenden TCP-Verbindungen und ersetzt dabei tcp-idle-timeout.
    edns-tcp-keepalive: yes
    edns-tcp-keepalive-timeout: 120000

    # ---------- Leistung ----------
    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    msg-cache-size: 64m
    rrset-cache-size: 128m
    key-cache-size: 16m
    # Fremde Nameserver ueber IPv4 fragen. Ist IPv6 am Server nicht sauber geroutet,
    # wartet Unbound sonst bei jedem IPv6-Nameserver auf einen Timeout. IPv4 kann jeder.
    prefer-ip4: yes
    # Beliebte Eintraege erneuern, bevor sie ablaufen
    prefetch: yes
    prefetch-key: yes
    # Abgelaufene Eintraege (hoechstens 24 h alt) SOFORT aus dem Cache beantworten und im
    # Hintergrund erneuern. Bei wenigen Nutzern laeuft fast jeder Eintrag zwischen zwei
    # Anfragen ab (viele TTLs sind nur 30-300 s) - ohne das wartet jede dieser Anfragen
    # auf eine volle Rekursion. Hilft nebenbei auch, wenn ein fremder Nameserver ausfaellt.
    # Preis: Die erste Antwort nach Ablauf kann veraltet sein; sie gilt beim Client nur 30 s.
    # (1800 statt 0 = erst 1,8 s lang neu aufloesen, dann erst die alte Antwort liefern.)
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 0
    serve-expired-reply-ttl: 30

    # ---------- Diagnose ----------
    # Mehr anonyme Zaehler fuer "unbound-control stats" (Anfragen ueber TLS und TCP,
    # TLS-Wiederaufnahmen, SERVFAIL ...). Nur Summen, keine IPs, keine Domains.
    extended-statistics: yes
