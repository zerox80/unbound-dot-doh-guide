# DNS-over-TLS (Port 853), oeffentlich erreichbar
server:
    interface: 0.0.0.0@853
    interface: ::0@853
    tls-port: 853
    # Kopie aus /etc/letsencrypt, wird von /usr/local/sbin/unbound-tls-deploy aktuell gehalten
    tls-service-key: "/etc/unbound/tls/privkey.pem"
    tls-service-pem: "/etc/unbound/tls/fullchain.pem"
    # DoT-Clients kommen aus beliebigen Netzen (Mobilfunk, WLAN).
    # Port 53 bleibt trotzdem nur lokal, weil Unbound dort nur an 127.0.0.1/::1 hoert.
    access-control: 0.0.0.0/0 allow
    access-control: ::/0 allow
