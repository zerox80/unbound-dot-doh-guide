# DNS-over-HTTPS fuer Unbound: nginx macht TLS + HTTP/2, Unbound beantwortet die Anfrage

# Max. 100 DoH-Anfragen/s pro Client-IP (Burst 400). Noetig, weil Unbound bei DoH
# nur nginx (127.0.0.1) als Absender sieht und selbst nicht pro Client bremsen kann.
# Nicht zu knapp waehlen: Ein Browser fragt pro Hostname bis zu 3 Typen (A, AAAA, HTTPS).
# Eine grosse Seite oder mehrere Tabs sind schnell einige hundert Anfragen auf einmal,
# und jede abgelehnte (429) laesst den Browser warten oder neu versuchen.
limit_req_zone $binary_remote_addr zone=doh_per_ip:10m rate=100r/s;

upstream unbound_doh {
    server 127.0.0.1:8053;
    keepalive 8;
}

# Port 80: nur Let's-Encrypt-Pruefung, sonst Umleitung auf HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dns.example.com;
    access_log off;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: DoH-Endpunkt https://dns.example.com/dns-query
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dns.example.com;

    ssl_certificate     /etc/letsencrypt/live/dns.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dns.example.com/privkey.pem;

    # Privatsphaere: keine Zugriffslogs (keine Client-IPs, keine Anfragen)
    access_log off;
    error_log /dev/null;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Leerlauf-Verbindungen 5 min halten (nginx-Standard: 75 s). Sonst zahlt der Client
    # nach jeder kurzen Pause wieder TCP- und TLS-Handshake vor der ersten Antwort.
    keepalive_timeout 300s;
    # nginx-Standard: Verbindung nach 1000 Anfragen schliessen. Das schafft ein Browser in Minuten.
    keepalive_requests 10000;

    location = /dns-query {
        limit_req zone=doh_per_ip burst=400 nodelay;
        limit_req_status 429;
        # Unbound spricht DoH nur ueber HTTP/2 -> grpc_pass ist nginx' HTTP/2-Proxy
        grpc_pass grpc://unbound_doh;
        grpc_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
